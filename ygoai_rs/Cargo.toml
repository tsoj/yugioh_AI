[package]
name = "ygoai_rs"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Python binding of the Rust duel engine (rust/, ygopro-core-rust) with the interface of ygoai.core.Duel"

[lib]
name = "ygoai_rs"
crate-type = ["cdylib"]

[dependencies]
ygo-core = { path = "../rust/ygo-core" }
ygo-cards = { path = "../rust/ygo-cards" }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310", "multiple-pymethods"] }

[profile.release]
debug = 1
