[package]
name = "ygoai_rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Python binding of the ygoai crate for the belief checks: their test games and replays"

[lib]
name = "ygoai_rs"
crate-type = ["cdylib"]

[dependencies]
ygo-core = { path = "../ygopro-core-rust/ygo-core" }
ygoai = { path = "../crates/ygoai" }
pythonize = "0.27"
serde = "1"
mimalloc = { version = "0.1", default-features = false }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }

