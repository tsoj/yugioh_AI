# The Rust side of ygoai: crates/ygoai (the port of the Python package ygoai) and its Python
# binding ygoai_rs. The duel engine (ygopro-core-rust/) is a workspace of its own.
[workspace]
resolver = "2"
members = ["ygoai_rs", "crates/ygoai", "crates/highs", "crates/deckmodels"]
exclude = ["ygopro-core-rust"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[profile.release]
debug = 1

# (no debug info for dependencies: burn's generic code made the binding 600 MB; ours keeps it for
# profiling)
[profile.release.package."*"]
debug = 0
