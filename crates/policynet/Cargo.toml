[package]
name = "policynet"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The imitation policy (scripts/policy/train.py) in Rust on burn, its weights from scripts/policy/export_policy.py, and its text embedding tables (embed_tables.py)"

[dependencies]
burn = { version = "0.22", default-features = false, features = ["std", "flex"] }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.11"
