[package]
name = "deckmodels"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The learned deck models (existence and counts) in Rust: burn code generated from their ONNX export"

[dependencies]
burn = { version = "0.22", default-features = false, features = ["std", "flex"] }
burn-store = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
burn-onnx = "0.22"
