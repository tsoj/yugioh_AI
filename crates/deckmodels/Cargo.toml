[package]
name = "deckmodels"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The learned deck models (existence and counts) in Rust on burn, their weights embedded (human_decks/export_deck_models.py)"

[dependencies]
burn = { version = "0.22", default-features = false, features = ["std", "flex"] }
half = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.11"
