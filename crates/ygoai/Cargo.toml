[package]
name = "ygoai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The ygoai package in Rust: core messages, per-player observations, responses, state views"

[dependencies]
ygo-core = { path = "../../rust/ygo-core" }
ygo-cards = { path = "../../rust/ygo-cards" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
blake2 = "0.10"
regex = "1"
