[package]
name = "bot-py-binding"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Python binding of the bot crate: the belief checks, their test games, replays"

[lib]
name = "bot_py_binding"
crate-type = ["cdylib"]

[dependencies]
ygo-core = { path = "../../ygopro-core-rust/ygo-core" }
bot = { path = "../bot" }
ygo-arbiter = { path = "../../ygopro-core-rust/ygo-arbiter" }
pythonize = "0.27"
serde = "1"
mimalloc = { version = "0.1", default-features = false }
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }

